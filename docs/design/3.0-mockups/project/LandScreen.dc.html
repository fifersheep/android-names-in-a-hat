<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone landscape (Top Hat)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Roboto+Flex:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; overflow: hidden; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; background: {{t.surface}}; color: {{t.onSurface}}">

  <sc-if value="{{isLists}}" hint-placeholder-val="{{ false }}">
    <div style="height: 60px; flex-shrink: 0; padding: 0 4px 0 24px; display: flex; align-items: center">
      <h1 style="margin: 0; flex-grow: 1; font-size: 28px; font-weight: 400; font-family: 'DM Serif Display', Georgia, serif">Your lists</h1>
      <button aria-label="More options" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="19" r="1.8" fill="currentColor"></circle></svg>
      </button>
    </div>
    <div role="list" style="width: 640px; align-self: center; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{lists}}" as="l" hint-placeholder-count="4">
        <div role="listitem" style="height: 68px; padding: 0 4px 0 20px; display: flex; align-items: center; gap: 8px; border-radius: {{l.radius}}; background: {{t.surfaceContainer}}">
          <a href="#" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: {{t.onSurface}}">
            <span style="font-size: 17px; font-weight: 500">{{l.name}}</span>
            <span style="font-size: 14px; color: {{t.onSurfaceVariant}}">{{l.meta}}</span>
          </a>
          <button aria-label="Options for {{l.name}}" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="19" r="1.8" fill="currentColor"></circle></svg>
          </button>
        </div>
      </sc-for>
    </div>
    <button style="position: absolute; right: 24px; bottom: 20px; height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; box-shadow: 0 3px 8px rgba(0,0,0,0.2); background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5 V19 M5 12 H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
      New list
    </button>
  </sc-if>

  <sc-if value="{{isEdit}}" hint-placeholder-val="{{ false }}">
    <div style="height: 76px; flex-shrink: 0; padding: 0 12px 0 4px; display: flex; align-items: center; gap: 8px">
      <button aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurface}}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12 H5 M11 6 L5 12 L11 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <div style="position: relative; flex-grow: 1; height: 52px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; border-radius: 4px; border: 1px solid {{t.outline}}">
        <span style="position: absolute; top: -9px; left: 10px; padding: 0 4px; font-size: 12px; font-weight: 500; background: {{t.surface}}; color: {{t.onSurfaceVariant}}">List name</span>
        <span style="font-size: 20px">Year 5 Maple</span>
      </div>
      <button style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font-size: 15px; font-weight: 700; color: {{t.primary}}">Done</button>
    </div>
    <div style="padding: 0 24px 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: {{t.onSurfaceVariant}}">14 names</div>
    <div role="list" style="flex-grow: 1; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; align-content: start; padding: 0 12px 0 24px">
      <sc-for list="{{editRows}}" as="r" hint-placeholder-count="6">
        <div role="listitem" style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid {{t.outlineVariant}}">
          <button aria-label="Rename {{r}}" style="flex-grow: 1; height: 48px; border: 0; padding: 0; background: transparent; text-align: left; font-size: 16px; color: {{t.onSurface}}">{{r}}</button>
          <button aria-label="Delete {{r}}" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 7 H19 M10 7 V5 H14 V7 M7 7 L8 19 H16 L17 7 M10 11 V16 M14 11 V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>
    <div style="height: 72px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; gap: 10px; background: {{t.surfaceContainer}}">
      <div style="position: relative; flex-grow: 1; height: 52px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; border-radius: 4px; border: 1px solid {{t.outline}}">
        <span style="position: absolute; top: -9px; left: 10px; padding: 0 4px; font-size: 12px; font-weight: 500; background: {{t.surfaceContainer}}; color: {{t.onSurfaceVariant}}">Add a name</span>
        <span style="font-size: 16px; color: {{t.onSurfaceVariant}}">e.g. Ada</span>
      </div>
      <button aria-label="Add" style="width: 48px; height: 48px; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.primary}}; color: {{t.onPrimary}}">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5 V19 M5 12 H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{isDraw}}" hint-placeholder-val="{{ true }}">
    <div style="height: 56px; flex-shrink: 0; padding: 0 4px; display: flex; align-items: center; gap: 4px">
      <button aria-label="Back to lists" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurface}}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12 H5 M11 6 L5 12 L11 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <h1 style="margin: 0 0 0 4px; flex-grow: 1; font-size: 24px; font-weight: 400; font-family: 'DM Serif Display', Georgia, serif">Year 5 Maple</h1>
      <button aria-label="Sort: A–Z" style="height: 40px; padding: 0 16px 0 12px; border: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; border-radius: 999px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7 H20 M4 12 H15 M4 17 H10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        A–Z
      </button>
      <button aria-label="Reset drawn names" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12 A7 7 0 1 0 7.5 6.6 M5 4 V9 H10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button aria-label="More options" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="19" r="1.8" fill="currentColor"></circle></svg>
      </button>
    </div>
    <div style="flex-grow: 1; display: flex; min-height: 0">
      <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
        <div style="height: 48px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid {{t.outlineVariant}}">
          <label style="display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 600">
            <span role="checkbox" aria-checked="mixed" aria-label="Select all, 17 of 24 in the hat, 4 drawn" tabindex="0" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: {{t.primaryContainer}}; border: 2px solid {{t.primary}}">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 12 H18" stroke="{{t.primary}}" stroke-width="3" stroke-linecap="round"></path></svg>
            </span>
            17 of 24 in the hat · 4 drawn
          </label>
        </div>
        <div style="flex-grow: 1; padding: 12px 16px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; overflow: hidden">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="24">
            <button aria-pressed="{{c.pressed}}" aria-label="{{c.a11y}}" style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; box-sizing: border-box; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.edge}}; text-decoration: {{c.deco}}">
              <sc-if value="{{c.isIn}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
              <sc-if value="{{c.isDrawn}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 7 H20 V10 A2 2 0 0 0 20 14 V17 H4 V14 A2 2 0 0 0 4 10 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg></sc-if>
              {{c.text}}
            </button>
          </sc-for>
        </div>
      </div>
      <div style="width: 200px; flex-shrink: 0; box-sizing: border-box; padding: 12px 16px 16px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px; background: {{t.surfaceContainer}}">
        <div role="group" aria-label="How many to draw" style="display: flex; flex-direction: column; gap: 2px">
          <button aria-label="Draw more" style="width: 72px; height: 48px; border: 0; display: flex; align-items: center; justify-content: center; border-radius: 28px 28px 6px 6px; background: {{t.surfaceContainerHigh}}; color: {{t.onSurface}}">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 6 V18 M6 12 H18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
          </button>
          <span aria-live="polite" style="width: 72px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; background: {{t.surfaceContainerHigh}}">2</span>
          <button aria-label="Draw fewer" style="width: 72px; height: 48px; border: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px 6px 28px 28px; background: {{t.surfaceContainerHigh}}; color: {{t.onSurface}}">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 12 H18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
          </button>
        </div>
        <button style="width: 168px; height: 56px; border: 0; font-size: 19px; font-weight: 700; border-radius: 999px; background: {{t.primary}}; color: {{t.onPrimary}}">Draw 2</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"screen":{"editor":"enum","options":["lists","edit","draw"],"default":"draw"},"$preview":{"width":844,"height":390}}'>
var TH = {
  light: {primary:'#4D4BB3',onPrimary:'#FFFFFF',primaryContainer:'#E2DFFF',onPrimaryContainer:'#0B006B',secondaryContainer:'#E3E0F9',onSecondaryContainer:'#1A1A2C',surface:'#FCF8FF',surfaceContainer:'#F0ECF7',surfaceContainerHigh:'#EAE6F1',onSurface:'#1B1B21',onSurfaceVariant:'#47464F',outline:'#787680',outlineVariant:'#C8C5D0'},
  dark: {primary:'#C3C0FF',onPrimary:'#1F1A86',primaryContainer:'#35319A',onPrimaryContainer:'#E2DFFF',secondaryContainer:'#46455A',onSecondaryContainer:'#E3E0F9',surface:'#131318',surfaceContainer:'#1F1F25',surfaceContainerHigh:'#2A292F',onSurface:'#E4E1E9',onSurfaceVariant:'#C8C5D0',outline:'#928F99',outlineVariant:'#47464F'}
};
var NAMES = ['Ada','Ben','Chloe','Dev','Eilidh','Femi','Grace','Hamza','Isla','Jack','Kai','Leah','Mo','Nia','Oscar','Priya','Quinn','Rory','Sam','Sam','Tom','Uma','Will','Zara'];
var OUT = {Ben: 1, Oscar: 1, Uma: 1};
var DRAWN = {Chloe: 1, Hamza: 1, Priya: 1};
var LISTS = [['Year 5 Maple', '24 names · 4 drawn'], ['Friday raffle', '120 names · 3 drawn'], ['Book club', '9 names'], ['Five-a-side', '10 names']];
class Component extends DCLogic {
  renderVals() {
    var t = TH[this.props.theme ?? 'light'] || TH.light;
    var screen = this.props.screen ?? 'draw';
    var chips = NAMES.map(function (n, i) {
      var s = OUT[n] ? 'out' : ((DRAWN[n] || (n === 'Sam' && i === 18)) ? 'drawn' : 'in');
      if (s === 'in') return {text: n, isIn: true, isDrawn: false, pressed: 'true', a11y: n + ', in the hat', bg: t.secondaryContainer, fg: t.onSecondaryContainer, edge: t.secondaryContainer, deco: 'none'};
      if (s === 'out') return {text: n, isIn: false, isDrawn: false, pressed: 'false', a11y: n + ', out of the hat', bg: 'transparent', fg: t.onSurfaceVariant, edge: t.outline, deco: 'none'};
      return {text: n, isIn: false, isDrawn: true, pressed: 'false', a11y: n + ', drawn', bg: t.surfaceContainerHigh, fg: t.onSurfaceVariant, edge: t.surfaceContainerHigh, deco: 'line-through'};
    });
    var last = LISTS.length - 1;
    var lists = LISTS.map(function (l, i) {
      var top = i === 0 ? '24px' : '6px';
      var bottom = i === last ? '24px' : '6px';
      return {name: l[0], meta: l[1], radius: top + ' ' + top + ' ' + bottom + ' ' + bottom};
    });
    return {
      t: t, chips: chips, lists: lists,
      editRows: ['Zara', 'Ada', 'Tom', 'Priya', 'Ben', 'Kai', 'Chloe', 'Sam', 'Isla', 'Hamza'],
      isLists: screen === 'lists', isEdit: screen === 'edit', isDraw: screen === 'draw'
    };
  }
}
</script>
</body>
</html>
