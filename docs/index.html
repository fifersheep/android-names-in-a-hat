<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Names in a Hat</title>
<meta name="description" content="Names in a Hat &ndash; a simple Android app for drawing names at random from a group.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1c1c1e; --muted: #5c5c66; --rule: #e2e2e8; --accent: #b4453a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #e9e9ec; --muted: #a2a2ad; --rule: #303038; --accent: #f08a7e; }
  }
  body {
    margin: 0 auto; padding: 3.5rem 1.25rem; max-width: 34rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  p.lede { color: var(--muted); margin-top: 0; }
  ul { list-style: none; padding: 0; margin: 2rem 0 0; }
  li { padding: .7rem 0; border-top: 1px solid var(--rule); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Names in a Hat</h1>
  <p class="lede">A simple Android app for drawing names at random from a group &mdash; classroom registers, team stand-ups, secret santa, whatever needs a fair pick.</p>
  <ul>
    <li><a href="privacy-policy.html">Privacy policy</a></li>
    <li><a href="https://github.com/fifersheep/android-names-in-a-hat">Source code on GitHub</a></li>
  </ul>
</body>
</html>
