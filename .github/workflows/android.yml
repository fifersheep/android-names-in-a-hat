# CI for the Names in a Hat 3.0 build: :app (Android) + :shared (Kotlin Multiplatform).
#
# iOS compile frequency: every pull request to main and every push to main.
# Why: the repository is public, so standard GitHub-hosted macOS runner minutes
# are free. If the repository goes private (macOS bills at a multiplier) or the
# job becomes a bottleneck, move ios-compile to a nightly schedule plus pushes to main.
#
# No job needs signing secrets: CI builds debug only, and release signing is
# configured only when the keystore properties are present (app/build.gradle.kts).
#
# Job IDs are the required status-check names on main; do not add a `name:` to a job.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint
        run: ./gradlew :app:lintDebug

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        # testAndroidHostTest: Robolectric tests for the Android-only SharedPreferences migration (NAM-6).
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest :app:testDebugUnitTest

  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # Key on the Kotlin version only, with no restore-keys fallback, so a Kotlin bump
      # starts a fresh ~/.konan instead of stacking a new toolchain onto the old one.
      - name: Read Kotlin version
        id: kotlin
        run: echo "version=$(sed -nE 's/^kotlin = "([^"]+)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-${{ steps.kotlin.outputs.version }}
      - name: Compile shared iOS targets
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64
