# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# Kotlin/Native (the :shared iOS targets) compiles and links inside the daemon, alongside KSP.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official

# Release signing. The keystore lives beside the repo, not in it; resolved with rootProject.file().
# niahKeyAlias, niahKeyPassword and niahKeystorePassword come from ~/.gradle/gradle.properties.
niahKeystoreFile=../android-keystore
